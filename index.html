<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nance Group</title>
<meta name="description" content="Nance Group — gestion multi-boutiques, République du Congo.">
<meta name="theme-color" content="#1A1A1E">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:#1A1A1E}body{display:flex;align-items:center;justify-content:center}img{width:260px}</style>
</head>
<body>
<img src="assets/logo-horizontal-fond-sombre.svg" alt="Nance Group">
<script>
  // Session Supabase présente → espace de gestion, sinon → connexion
  var connecte = false;
  try { connecte = !!(localStorage.getItem('nance-auth') || sessionStorage.getItem('nance-auth')); } catch (e) {}
  location.replace(connecte ? 'app.html' : 'connexion.html');
</script>
<noscript><p style="color:#F4F1EC;font-family:sans-serif">Activez JavaScript pour utiliser Nance Group.</p></noscript>
</body>
</html>
